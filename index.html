<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peques Bo · libros para peques de 0 a 6 años</title>
<meta name="description" content="Libros infantiles para peques de 0 a 6 años: estimulación, trazos, lectura, números, rutinas y concentración.">
<meta name="theme-color" content="#3AAFC4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%233AAFC4'/%3E%3Ctext x='32' y='47' font-size='42' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23FF5815' stroke='%23ffffff' stroke-width='4' paint-order='stroke'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Peques Bo · tienda · mobile first
   Fondo blanco y limpio. El color vive en los detalles: botones, etiquetas, tarjetas de edad,
   encabezado (turquesa), pie de página (verde) y una franja fina con los colores del logo. */
:root{
  --ink:#1E4046; --muted:#4E6870; --line:#E8E1D5; --soft-bg:#F6F0E6; --beige:#FFF8EF; --deep:#0B4D52; --white:#fff;
  --orange:#FF5815; --orange-btn:#E5460D; --orange-text:#C2410C; --yellow:#FFBD08; --teal:#3AAFC4; --green:#0E6065;
  --lila:#8C84F5; --rosa:#FC47A9; --wa:#168A45;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 2px 12px rgba(12,38,46,.08); --shadow-lg:0 10px 30px rgba(12,38,46,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.55;color:var(--ink);background:var(--beige);padding-bottom:92px}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0}
h1,h2{color:var(--green)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
[hidden]{display:none!important}
.loading,.empty{padding:56px 0;text-align:center;color:var(--muted)}
#demobar{background:var(--ink);color:#fff;font-size:14px;padding:8px 16px;text-align:center}

/* franja con los colores del logo */
.flag,.top::after,#foot::before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--orange) 0 33.33%,var(--yellow) 33.33% 66.66%,var(--green) 66.66% 100%)}
.flag{display:none}

/* encabezado */
.top{position:sticky;top:0;z-index:30;background:var(--teal);color:var(--deep)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px}
.logo{display:inline-flex;flex-direction:column;align-items:center;text-decoration:none;line-height:1}
.logo img{height:46px;width:auto}
.logo-sub{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.5px;color:#3E4C50;
  -webkit-text-stroke:5px #fff;paint-order:stroke fill;margin-top:1px}
.top-actions{display:flex;gap:10px}
.iconbtn{width:46px;height:46px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;color:var(--green);box-shadow:var(--shadow)}
.iconbtn:active{transform:scale(.94)}

#searchbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 0;position:sticky;top:73px;z-index:29;box-shadow:var(--shadow)}
#q{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;font:inherit;background:var(--soft-bg)}
#q:focus{border-color:var(--teal);outline:none;background:#fff}
#searchres{display:grid;gap:8px;margin-top:10px;max-height:55vh;overflow:auto}
.sr{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px;width:100%}
.sr img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.sr b{font-family:var(--display);font-weight:500;display:block;font-size:16px}
.sr span span{color:var(--orange-text);font-weight:700}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 22px;border:1.5px solid var(--green);border-radius:999px;background:#fff;color:var(--green);
  font-family:var(--display);font-weight:600;font-size:16px;text-decoration:none;transition:transform .12s,box-shadow .12s}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--orange-btn);border-color:var(--orange-btn);color:#fff}
.btn-fresh{background:var(--green);border-color:var(--green);color:#fff}
.btn-accent{background:var(--yellow);border-color:var(--yellow);color:var(--deep)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff;width:100%;font-size:18px;min-height:54px}
.btn-block{width:100%}
.btn[disabled],.btn.is-off{opacity:.55;pointer-events:none}
.btn-sm{min-height:42px;padding:6px 14px;font-size:15px}

/* inicio */
.hero{padding:44px 16px 8px;text-align:center}
.hero h1{font-size:clamp(32px,7vw,54px);max-width:20ch;margin:0 auto 12px}
.hero p{max-width:36ch;margin:0 auto 28px;color:var(--muted);font-size:18px}
.ages{display:grid;gap:14px;max-width:900px;margin:0 auto;grid-template-columns:1fr}
.age{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;text-decoration:none;padding:22px 20px;border-radius:24px;transition:transform .15s,box-shadow .15s}
.age:hover,.age:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.age .n{font-family:var(--display);font-weight:600;font-size:50px;line-height:1}
.age .n small{font-size:22px;margin-left:6px;font-weight:500}
.age-1{background:#1F8CA3;color:#fff}.age-2{background:var(--yellow);color:var(--green)}.age-3{background:var(--orange-btn);color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:30px auto 18px}
.badge{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff;font-size:14px;font-weight:700}
.ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.support{max-width:640px;margin:32px auto 0;text-align:center;font-size:15px;color:var(--muted)}
.support strong{display:block;color:var(--ink);margin-top:6px;font-size:14px}
.sec{padding:56px 0 4px}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px;margin-bottom:18px}
.sec h2{font-size:clamp(26px,5vw,36px)}

/* banners */
.banners{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 16px 0;scrollbar-width:none}
.banner{flex:0 0 min(92%,720px);scroll-snap-align:center;position:relative;border-radius:22px;overflow:hidden;background:var(--yellow);text-decoration:none;min-height:96px;display:block;box-shadow:var(--shadow)}
.banner img{width:100%;max-height:260px;object-fit:cover}
.banner span{position:absolute;left:12px;bottom:12px;right:12px;background:#fff;border-radius:12px;padding:6px 14px;font-family:var(--display);font-weight:600}
.banner.txt{display:grid;place-items:center;padding:24px;text-align:center;font-family:var(--display);font-weight:600;font-size:20px}
.banner.txt span{position:static;background:none;padding:0}

/* catálogo */
.page-h{padding:40px 0 0;text-align:center}
.page-h h1{font-size:clamp(32px,6vw,46px)}
.page-h p{color:var(--muted);margin:8px auto 0;max-width:46ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 0}
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px;min-height:42px}
.pill[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--teal));flex:none}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 16px;color:var(--muted)}
.toolbar select{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;font:inherit;color:var(--ink);max-width:100%}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters label{display:flex;align-items:center;gap:8px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 18px;margin:0 -16px}
.row .card{flex:0 0 min(70vw,280px);scroll-snap-align:start}
.card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.card-img{position:relative;aspect-ratio:1/1;background:var(--soft-bg);border:0;padding:0;display:block;width:100%}
.card-img img{width:100%;height:100%;object-fit:cover}
.chips{position:absolute;left:8px;top:8px;right:52px;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(12,38,46,.15)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--teal))}
.chip.a-0-2{--c:var(--teal)}.chip.a-2-4{--c:var(--yellow)}.chip.a-4-6{--c:var(--orange)}
.chip.plain::before{display:none}
.share{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;padding:0;box-shadow:0 1px 4px rgba(12,38,46,.2)}
.ribbon{position:absolute;left:0;bottom:12px;background:var(--yellow);color:var(--deep);font-family:var(--display);font-weight:600;font-size:13px;padding:3px 12px 3px 10px;border-radius:0 999px 999px 0;max-width:90%}
.card-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:18px;line-height:1.2;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--tint,#E3F4F8)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--teal))}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.price b,.price .free{font-family:var(--display);font-weight:600;font-size:23px;color:var(--orange-text)}
.price .free{color:var(--green)}
.price s{color:var(--muted);font-size:14px}
.price .off{font-size:12px;font-weight:700;background:var(--yellow);border-radius:8px;padding:0 7px}
.card-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.card-act .btn{flex:1 1 90px;padding:6px 10px;min-height:42px;font-size:15px}

/* PDFs */
.howto{max-width:640px;margin:22px auto 0;padding:18px 22px;border-radius:20px;background:var(--soft-bg)}
.howto p{margin:0}
.paychips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.paychips .badge{font-size:13px}

/* páginas de texto */
.text{max-width:680px;margin:0 auto;padding:30px 0 16px}
.text p{margin:0 0 14px}
.text ul{padding-left:20px;margin:0 0 14px}
.text li{margin-bottom:6px}
.text img.about{border-radius:24px;margin-bottom:22px;max-height:360px;object-fit:cover;width:100%;box-shadow:var(--shadow)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 20px;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;background:var(--soft-bg);border-radius:18px;padding:14px}
.steps li::before{content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:21px}
.steps li:nth-child(4n+2)::before{background:var(--yellow)}
.steps li:nth-child(4n+3)::before{background:var(--orange)}
.steps li:nth-child(4n)::before{background:var(--green);color:#fff}
.rates{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rates td,.rates th{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left}
.rates td:last-child,.rates th:last-child{text-align:right}
.reviews{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.reviews figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.reviews figcaption{padding:10px 14px;font-size:14px}

/* pie */
#foot{margin-top:72px;background:var(--green);color:#fff;text-align:center}
#foot .in{padding:36px 16px 30px}
#foot .logo{margin:0 auto}
#foot .logo img{height:58px}
#foot p{margin:12px auto 0;max-width:52ch;font-size:15px}
#foot .links{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:center;margin-top:20px}
#foot .links a{font-weight:700}
#foot .legal{font-size:14px;opacity:.92}

/* carrito flotante */
#cartbtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 20px;border-radius:999px;border:0;background:var(--yellow);color:var(--deep);box-shadow:var(--shadow-lg);font-family:var(--display);font-weight:600;font-size:17px}
#cartbtn b{background:var(--orange-btn);color:#fff;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;padding:0 6px}
#cartbtn.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.1)}}

/* paneles laterales */
#scrim{position:fixed;inset:0;background:rgba(12,38,46,.5);z-index:50}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:60;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.p-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--teal);color:var(--deep)}
.p-head h2{color:var(--deep)}
.p-head::after{content:none}
.p-head h2{flex:1;font-size:24px}
.p-btn{width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--green);display:grid;place-items:center;font-size:22px;line-height:1;padding:0;box-shadow:var(--shadow)}
.p-body{flex:1;overflow:auto;padding:16px}
.p-foot{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#fff}
#menu a{display:block;padding:16px 6px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:500;font-size:21px;color:var(--ink);text-decoration:none}
#menu a[aria-current="page"]{color:var(--orange-text);font-weight:600}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:10px}
.line img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.line b{font-family:var(--display);font-weight:500;font-size:16px;line-height:1.2;display:block}
.line .pr{color:var(--orange-text);font-weight:700}
.qty{display:inline-flex;align-items:center;gap:10px;margin-top:4px}
.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--yellow);color:var(--deep);font-weight:700;padding:0}
.rm{border:0;background:none;color:var(--muted);padding:6px;font-size:13px;text-decoration:underline}
.coupon{display:flex;gap:8px;margin:14px 0 6px}
.coupon input,.f input,.f select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.coupon input:focus,.f input:focus,.f select:focus{border-color:var(--teal);outline:none}
.msg{font-size:14px;min-height:20px;margin:0 0 6px}
.msg.ok{color:var(--green);font-weight:700}.msg.bad{color:var(--orange-text);font-weight:700}
.hint{background:var(--soft-bg);border-radius:12px;padding:10px 14px;font-size:14px}
.sum{background:var(--soft-bg);border-radius:16px;padding:6px 16px;margin-bottom:16px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0;font-family:var(--display);font-weight:600;font-size:20px}
.sum .tot{color:var(--orange-text)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:16px}
.f label{font-size:13px;font-weight:700;display:block;margin-bottom:3px}
.f .full{grid-column:1/-1}
.f .bad input,.f .bad select{border-color:var(--orange);background:#FFF1EB}
.fine{font-size:13px;text-align:center;color:var(--muted);margin:10px 0 0}
.stack{display:grid;gap:10px}

/* detalle de producto */
#modal{position:fixed;inset:0;z-index:70;display:grid;place-items:end center;background:rgba(12,38,46,.55);padding:0}
.sheet{position:relative;background:#fff;width:min(980px,100%);max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;display:grid;grid-template-columns:1fr;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet .x{position:absolute;right:10px;top:10px;z-index:3}
.gal{padding:14px;background:var(--soft-bg)}
.gal-main{position:relative;border-radius:18px;overflow:hidden;background:#fff;aspect-ratio:1/1}
.gal-main img,.gal-main video,.gal-main iframe{width:100%;height:100%;object-fit:cover;border:0}
.gal-main .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px}
.nav.prev{left:8px}.nav.next{right:8px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding:2px}
.thumbs button{flex:0 0 54px;height:54px;border:2px solid transparent;border-radius:10px;overflow:hidden;padding:0;background:#fff;opacity:.7}
.thumbs button[aria-current="true"]{opacity:1;border-color:var(--orange)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:20px 20px 30px;display:grid;gap:16px;align-content:start}
.info h2{font-size:30px;padding-right:44px}
.info .chips{position:static;pointer-events:auto}
.info .chip{box-shadow:none;border:1px solid var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.info h3{font-size:19px;margin-bottom:6px}
.info ul{margin:0;padding-left:20px}
.info p{margin:0 0 10px}
.faq details{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.faq summary{font-weight:700;cursor:pointer}
.faq details p{margin:8px 0 0}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:90;opacity:0;pointer-events:none;transition:.2s;max-width:min(92vw,420px);display:flex;gap:12px;align-items:center;font-size:15px;box-shadow:var(--shadow-lg)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:var(--yellow);color:var(--deep);border:0;border-radius:999px;padding:5px 14px;font-weight:700}

@media (min-width:700px){
  .grid{grid-template-columns:repeat(3,1fr);gap:20px}
  .ages{grid-template-columns:repeat(3,1fr)}
  .age{flex-direction:column;align-items:center;gap:4px;padding:30px 16px}
  .age .n{font-size:62px}
  .reviews{grid-template-columns:repeat(3,1fr)}
  .row{margin:0;padding:4px 4px 18px}
  .hero{padding-top:60px}
  .logo img{height:54px}
  #searchbar{top:81px}
  #modal{place-items:center;padding:24px}
  .sheet{border-radius:28px;grid-template-columns:1.05fr 1fr;max-height:90vh}
}
@media (min-width:1000px){
  .grid{grid-template-columns:repeat(4,1fr)}
  body{padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* títulos y subtítulos de color, nada de negro */
.info h2,.info h3,.sec h2,.page-h h1,.hero h1{color:var(--green)}
.card h3{color:var(--ink)}
.search-hint{display:none}

/* temas: una sola fila que se desliza en celular */
.pills.topics{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;margin-top:10px;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills.topics::-webkit-scrollbar{display:none}
.pills.topics .pill{flex:none;white-space:nowrap}
@media (min-width:700px){.pills.topics{flex-wrap:wrap;justify-content:center;overflow:visible}}

/* ventana de pago de PDFs */
#paymodal{position:fixed;inset:0;z-index:85;display:grid;place-items:end center;background:rgba(12,38,46,.55)}
.paybox{position:relative;background:#fff;width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px 28px;animation:rise .22s ease-out}
.paybox .x{position:absolute;right:12px;top:12px}
.paybox h2{font-size:24px;padding-right:48px;margin-bottom:6px}
.pay-price{font-family:var(--display);font-weight:600;font-size:36px;color:var(--orange-text);margin:2px 0 12px}
.paychoices{display:grid;gap:8px;margin-bottom:16px}
.paychoice{display:grid;grid-template-columns:1fr auto;text-align:left;gap:2px 10px;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px}
.paychoice b{font-family:var(--display);font-weight:500;font-size:17px}
.paychoice span{font-family:var(--display);font-weight:600;color:var(--orange-text)}
.paychoice small{grid-column:1/-1;color:var(--muted)}
.paychoice[aria-checked="true"]{border-color:var(--green);background:#EFF7F6;box-shadow:0 0 0 1.5px var(--green) inset}
.paydetail{display:grid;gap:12px}
.paydetail p{margin:0}
.paynum{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft-bg);border-radius:14px;padding:10px 14px}
.paynum b{font-size:18px;word-break:break-all}
.payqr{max-width:220px;border-radius:14px;margin:0 auto}
.paybox .fine{text-align:left}
@media (min-width:700px){#paymodal{place-items:center;padding:24px}.paybox{border-radius:26px}}

</style>

    tiktok_url: 'https://www.tiktok.com/@aylincayoja',
    tiktok_live_url: 'https://www.tiktok.com/@aylincayoja/live',
    instagram_url: '',
    free_shipping_min: 400,
    shipping_rates: [
      { city: 'La Paz', price: 20 }, { city: 'El Alto', price: 20 }, { city: 'Cochabamba', price: 15 },
      { city: 'Santa Cruz', price: 25 }, { city: 'Sucre', price: 25 }, { city: 'Oruro', price: 25 },

    pay_auto_rate: true,
    pay_rate_ars: 0,
    pay_rate_pen: 0,
    pay_margin: 0,
    paypal_user: '',
    mp_alias: '',
    mp_holder: '',
    yape_number: '',
    yape_holder: '',
    yape_qr: '',
    banners: [],
    pixel_tiktok: '',
    pixel_meta: '',
    support_text: 'Nuestros libros apoyan la atención, las rutinas y la concentración y están pensados para distintos ritmos de aprendizaje.',
    disclaimer: 'Material de apoyo, no reemplaza una terapia ni una evaluación profesional.',

    contact_text: 'Escríbenos por WhatsApp y te respondemos lo antes posible. También hacemos lives en TikTok con precios especiales.',
    footer_text: ''
  };

  const normProduct = (p) => Object.assign({}, p, {
    price: Number(p.price) || 0,
    old_price: Number(p.old_price) || 0,
    ages: p.ages || [], topics: p.topics || [], images: p.images || [],
    faq: Array.isArray(p.faq) ? p.faq : [],
    includes: p.includes || '',
    has_gender: !!p.has_gender
  });

  async function load() {
    const D = window.PEQUESBO_DEMO;
    if (!sb) { applyTopics(DEFAULT_TOPICS); return { demo: true, products: D.products.map(normProduct), settings: Object.assign({}, DEFAULT_SETTINGS), reviews: [] }; }
    const [p, s, r] = await Promise.all([
      sb.from('products').select('*').order('sort_order', { ascending: true }).order('created_at', { ascending: false }),
      sb.from('settings').select('*'),
      sb.from('reviews').select('*').eq('visible', true).order('created_at', { ascending: false })
    ]);
    if (p.error) throw p.error;
    const settings = Object.assign({}, DEFAULT_SETTINGS);
    (s.data || []).forEach((row) => { settings[row.key] = row.value; });
    applyTopics(settings.topics);
    return { demo: false, products: (p.data || []).map(normProduct), settings, reviews: r.data || [] };
  }

  // Convierte la lista de temas guardada en el objeto que usan la tienda y el panel.
  function applyTopics(list) {
    const L = Array.isArray(list) && list.length ? list : DEFAULT_TOPICS;
    const tint = (hex) => {
      const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '')); if (!m) return '#E8F1F3';
      const n = parseInt(m[1], 16); const mix = (c) => Math.round(c + (255 - c) * 0.84);
      return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((c) => mix(c).toString(16).padStart(2, '0')).join('');
    };
    const o = {};
    L.forEach((t) => { if (t && t.key && t.label) o[t.key] = { label: String(t.label), color: t.color || '#3AAFC4', tint: tint(t.color || '#3AAFC4') }; });
    window.PB.TOPICS = o;
  }

  const cleanPhone = (v) => String(v || '').replace(/\D/g, '');

  window.PB = { sb, AGES, TOPICS: {}, DEFAULT_SETTINGS, DEFAULT_TOPICS, load, cleanPhone, normProduct, applyTopics };
  applyTopics(DEFAULT_TOPICS);
})();

<script>
/* pequesbo · tienda */
(function () {
  'use strict';
  const PB = window.PB;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  const num = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(2));
  const bs = (v) => 'Bs ' + num(v);
  const priceOf = (p, v) => (p.format === 'pdf' ? 'USD ' : 'Bs ') + num(v);

  const S = {
    products: [], settings: {}, reviews: [], demo: false,
    cart: [], coupon: null,
    f: { age: 'all', topic: 'all', sort: 'rel' },
    form: { name: '', phone: '', city: '', material: '' },
    panel: 'cart', cur: null, gi: 0, order: null
  };

  /* ---------- utilidades ---------- */
  // Secciones apagadas por ahora (se activan cambiando false por true).
  const FEATURES = { pdf: true, envios: false, proceso: false, cupones: false };
  const vis = () => S.products.filter((p) => !p.hidden && (FEATURES.pdf || p.format !== 'pdf'));
  const find = (id) => S.products.find((p) => String(p.id) === String(id));
  const pct = (p) => (p.old_price > p.price && p.price > 0 ? Math.round((1 - p.price / p.old_price) * 100) : 0);
  const waNumber = () => PB.cleanPhone(S.settings.whatsapp);
  const waLink = (text) => `https://wa.me/${waNumber()}?text=${encodeURIComponent(text)}`;
  const baseUrl = () => location.href.split('#')[0];

  function rich(text) {
    const lines = String(text || '').split('\n');
    let out = '', list = [], para = [];
    const flushP = () => { if (para.length) { out += `<p>${para.join('<br>')}</p>`; para = []; } };
    const flushL = () => { if (list.length) { out += `<ul>${list.map((l) => `<li>${l}</li>`).join('')}</ul>`; list = []; } };
    lines.forEach((l) => {
      const t = l.trim();
      if (!t) { flushP(); flushL(); }
      else if (/^[-•]\s+/.test(t)) { flushP(); list.push(esc(t.replace(/^[-•]\s+/, ''))); }
      else { flushL(); para.push(esc(t)); }
    });
    flushP(); flushL();
    return out;
  }

  let toastTimer;
  function toast(msg, actionLabel, action) {
    const t = $('#toast');
    t.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : '');
    if (actionLabel) $('button', t).onclick = () => { action(); t.classList.remove('on'); };
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 3600);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { /* nada */ }
      ta.remove(); return ok;
    }
  }

  /* ---------- píxeles ---------- */
  function initPixels() {
    const tt = String(S.settings.pixel_tiktok || '').trim();
    const fb = String(S.settings.pixel_meta || '').trim();
    if (tt && /^[A-Z0-9]+$/i.test(tt)) {
      !function (w, d, t) {
        w.TiktokAnalyticsObject = t; const ttq = w[t] = w[t] || [];
        ttq.methods = ['page', 'track', 'identify', 'instances', 'debug', 'on', 'off', 'once', 'ready', 'alias', 'group', 'enableCookie', 'disableCookie'];
        ttq.setAndDefer = function (t, e) { t[e] = function () { t.push([e].concat(Array.prototype.slice.call(arguments, 0))); }; };
        for (let i = 0; i < ttq.methods.length; i++) ttq.setAndDefer(ttq, ttq.methods[i]);
        ttq.instance = function (t) { const e = ttq._i[t] || []; for (let n = 0; n < ttq.methods.length; n++) ttq.setAndDefer(e, ttq.methods[n]); return e; };
        ttq.load = function (e, n) {
          const i = 'https://analytics.tiktok.com/i18n/pixel/events.js';
          ttq._i = ttq._i || {}; ttq._i[e] = []; ttq._i[e]._u = i; ttq._t = ttq._t || {}; ttq._t[e] = +new Date(); ttq._o = ttq._o || {}; ttq._o[e] = n || {};
          const o = d.createElement('script'); o.type = 'text/javascript'; o.async = !0; o.src = i + '?sdkid=' + e + '&lib=' + t;
          const a = d.getElementsByTagName('script')[0]; a.parentNode.insertBefore(o, a);
        };
        ttq.load(tt); ttq.page();
      }(window, document, 'ttq');
    }
    if (fb && /^\d+$/.test(fb)) {
      !function (f, b, e, v, n, t, s) {
        if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
        if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
        t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
      }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
      window.fbq('init', fb); window.fbq('track', 'PageView');
    }
  }

  function track(ev, p, qty) {
    try {
      const data = p ? { content_type: 'product', content_id: String(p.id), content_name: p.name, quantity: qty || 1, value: p.price, currency: p.format === 'pdf' ? 'USD' : 'BOB' } : {};
      if (window.ttq) window.ttq.track(ev, data);
      if (window.fbq) window.fbq('track', ev, data);
    } catch (e) { /* los píxeles nunca deben romper la tienda */ }
  }

  /* ---------- carrito ---------- */
  const CART_KEY = 'pequesbo_cart_v1';
  function loadCart() { try { S.cart = JSON.parse(localStorage.getItem(CART_KEY)) || []; } catch (e) { S.cart = []; } }
  function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(S.cart)); } catch (e) { /* ok */ } S.order = null; renderCartBtn(); }
  const lines = () => S.cart.map((c) => ({ p: find(c.id), qty: c.qty })).filter((l) => l.p && !l.p.hidden && l.p.format !== 'pdf');
  const count = () => lines().reduce((a, l) => a + l.qty, 0);

  function renderCartBtn() {
    $('#cartcount').textContent = count();
    const b = $('#cartbtn'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  }

  function addToCart(id) {
    const p = find(id);
    if (!p || p.paused || p.format === 'pdf') return;
    const it = S.cart.find((c) => String(c.id) === String(id));
    if (it) it.qty += 1; else S.cart.push({ id: p.id, qty: 1 });
    saveCart(); track('AddToCart', p);
    toast('Agregado: ' + p.name, 'Ver pedido', () => openPanel('cart'));
  }

  function totals() {
    const ls = lines();
    const subtotal = ls.reduce((a, l) => a + l.p.price * l.qty, 0);
    let discount = 0;
    if (S.coupon) {
      discount = S.coupon.kind === 'percent' ? subtotal * (S.coupon.value / 100) : Math.min(S.coupon.value, subtotal);
      discount = Math.round(discount * 100) / 100;
    }
    const net = subtotal - discount;
    const min = Number(S.settings.free_shipping_min) || 0;
    let shipping = { amount: null, free: false };
    if (subtotal > 0 && min > 0 && net >= min) shipping = { amount: 0, free: true };
    else if (S.form.city) {
      const r = (S.settings.shipping_rates || []).find((x) => norm(x.city) === norm(S.form.city));
      if (r) shipping = { amount: Number(r.price) || 0, free: false };
    }
    const total = net + (shipping.amount || 0);
    return { ls, subtotal, discount, net, shipping, total, min };
  }

  async function applyCoupon(code) {
    const el = $('#cmsg'); code = String(code || '').trim();
    if (!code) return;
    let c = null;
    try {
      if (PB.sb) { const { data } = await PB.sb.rpc('validate_coupon', { p_code: code }); c = data; }
      else c = (window.PEQUESBO_DEMO.coupons || []).find((x) => x.code === code.toUpperCase());
    } catch (e) { c = null; }
    const t = totals();
    if (!c) { S.coupon = null; el.className = 'msg bad'; el.textContent = 'Ese cupón no es válido o ya venció.'; }
    else if (t.subtotal < Number(c.min_total || 0)) { S.coupon = null; el.className = 'msg bad'; el.textContent = `Este cupón aplica desde ${bs(Number(c.min_total))} en libros.`; }
    else { S.coupon = c; S.order = null; renderPanel(); $('#cmsg').className = 'msg ok'; $('#cmsg').textContent = 'Cupón aplicado: ' + c.code; }
  }

  /* ---------- tarjetas ---------- */
  const ageChips = (p) => p.ages.map((a) => `<span class="chip a-${a}">${esc(PB.AGES[a] || a)}</span>`).join('');
  const topicTags = (p, max) => p.topics.filter((k) => PB.TOPICS[k]).slice(0, max || 2).map((k) => { const t = PB.TOPICS[k]; return `<span class="tag" style="--c:${t.color};--tint:${t.tint}">${esc(t.label)}</span>`; }).join('');
  const shareBtn = (id) => `<button class="share" data-act="share" data-id="${esc(id)}" aria-label="Compartir"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.7l7.4-4.4M8.3 13.3l7.4 4.4"/></svg></button>`;

  function priceHtml(p) {
    if (p.is_free) return '<div class="price"><span class="free">Gratis</span></div>';
    const d = pct(p);
    return `<div class="price"><b>${priceOf(p, p.price)}</b>${p.old_price > p.price ? `<s>${priceOf(p, p.old_price)}</s>` : ''}${d ? `<span class="off">-${d}%</span>` : ''}</div>`;
  }

  function ribbon(p) {
    if (p.live_deal) return '<span class="ribbon">Precio del live</span>';
    if (p.is_combo && p.old_price > p.price) return `<span class="ribbon">Combo · ahorras ${priceOf(p, p.old_price - p.price)}</span>`;
    if (p.is_new) return '<span class="ribbon">Nuevo</span>';
    return '';
  }

  function card(p) {
    const img = p.images[0] || '';
    const act = p.paused
      ? '<span class="btn btn-sm is-off">Pausado por ahora</span>'
      : p.format === 'pdf'
        ? `<button class="btn btn-primary btn-sm" data-act="request" data-id="${esc(p.id)}">Solicitar</button>`
        : `<button class="btn btn-primary btn-sm" data-act="add" data-id="${esc(p.id)}">Agregar</button>`;
    return `<article class="card">
      <button class="card-img" data-act="detail" data-id="${esc(p.id)}" aria-label="Ver detalle de ${esc(p.name)}">
        ${img ? `<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">` : ''}
        <span class="chips">${p.format === 'pdf' ? '<span class="chip plain">PDF digital</span>' : ''}${ageChips(p)}</span>
        ${ribbon(p)}
      </button>
      ${shareBtn(p.id)}
      <div class="card-b"><h3>${esc(p.name)}</h3>${priceHtml(p)}
        <div class="card-act"><button class="btn btn-sm" data-act="detail" data-id="${esc(p.id)}">Ver detalle</button>${act}</div>
      </div></article>`;
  }

  /* ---------- vistas ---------- */
  const NAV_ALL = [
    ['catalogo', 'Nuestro catálogo'], ['pdf', 'Digitales PDF'], ['nosotros', 'Sobre nosotros'],
    ['envios', 'Envíos y recomendaciones'], ['proceso', 'El proceso de envío'], ['contacto', 'Contáctanos']
  ];
  const NAV = NAV_ALL.filter(([k]) => FEATURES[k] !== false);
  const trace = '';

  function bannersHtml() {
    const b = (S.settings.banners || []).filter((x) => x && (x.image || x.text));

      const inner = x.image ? `<img src="${esc(x.image)}" alt="${esc(x.text || '')}">${x.text ? `<span>${esc(x.text)}</span>` : ''}` : `<span>${esc(x.text)}</span>`;

      <h1>¿Qué edad tiene tu peque?</h1>

    </section>
    <div class="wrap">
      <div class="badges"><span class="badge">Envíos a toda Bolivia</span>${FEATURES.pdf ? '<span class="badge">PDFs para toda Latinoamérica</span>' : ''}</div>
      <div class="ctas"><a class="btn btn-primary" href="#/catalogo?edad=all">Ver todo el catálogo</a>${FEATURES.pdf ? '<a class="btn btn-fresh" href="#/pdf">Digitales PDF</a>' : ''}</div>
    </div>
    ${live.length ? `<section class="sec wrap"><div class="sec-h"><h2>Precio especial del live</h2>${s.tiktok_live_url ? `<a class="btn btn-sm btn-accent" href="${esc(s.tiktok_live_url)}" target="_blank" rel="noopener">Ver mis lives en TikTok</a>` : ''}</div>${trace}${rowOf(live)}</section>` : ''}
    ${feat.length ? `<section class="sec wrap"><h2>Destacados</h2>${trace}${rowOf(feat)}</section>` : ''}
    ${combos.length ? `<section class="sec wrap"><h2>Combos para ahorrar</h2>${trace}${rowOf(combos)}</section>` : ''}

  function viewCatalog() {
    const list = vis().filter((p) => p.format !== 'pdf')

    const topicPills = Object.entries(PB.TOPICS).map(([k, t]) => `<button class="pill topic" data-act="f-topic" data-v="${k}" aria-pressed="${S.f.topic === k}"><span class="dot" style="--c:${t.color}"></span>${esc(t.label)}</button>`).join('')
      + `<button class="pill topic" data-act="f-topic" data-v="all" aria-pressed="${S.f.topic === 'all'}">Todos los temas</button>`;
    return `<div class="wrap">
      <div class="page-h"><h1>Nuestro catálogo</h1></div>

        <label>Ordenar <select data-act="sort"><option value="rel">Recomendados</option><option value="asc"${S.f.sort === 'asc' ? ' selected' : ''}>Menor precio</option><option value="desc"${S.f.sort === 'desc' ? ' selected' : ''}>Mayor precio</option><option value="off"${S.f.sort === 'off' ? ' selected' : ''}>Mayor descuento</option></select></label>
      </div>
      ${list.length ? `<div class="grid">${list.map(card).join('')}</div>` : '<p class="empty">No hay libros con esos filtros. Prueba con otra edad o tema.</p>'}
    </div>`;
  }

  function viewPdf() {
    const list = vis().filter((p) => p.format === 'pdf');
    const st = S.settings; const pm = st.pay_methods || {}; const on = (k) => pm[k] !== false;
    const chips = [on('hotmart') && 'Tarjeta (Hotmart)', on('paypal') && st.paypal_user && 'PayPal', on('mercadopago') && st.mp_alias && 'MercadoPago · Argentina', on('yape') && st.yape_number && 'Yape · Perú'].filter(Boolean).map((l) => `<span class="badge">${l}</span>`).join('');

  /* ---------- pedido ---------- */
  function orderNumber() {
    const d = new Date(); const pad = (n) => String(n).padStart(2, '0');
    const r = Math.random().toString(36).slice(2, 6).toUpperCase();
    return `PB-${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${r}`;

  function validateForm() {
    const f = S.form; let ok = true; let first = null;
    const mark = (g, bad, input) => { $(g).classList.toggle('bad', bad); if (bad) { ok = false; first = first || input; } };
    mark('#g-name', f.name.trim().length < 2, '#f-name');
    mark('#g-phone', PB.cleanPhone(f.phone).length < 7, '#f-phone');
    mark('#g-city', f.city.trim().length < 2, '#f-city');
    if (!ok) { toast('Completa tu nombre, número y ciudad.'); $(first).focus(); }
    return ok;
  }

  function buildOrder() {
    const t = totals(); const f = S.form;
    if (!S.order) S.order = { number: orderNumber(), saved: false };
    const items = t.ls.map(({ p, qty }) => `- ${qty} x ${p.name} (${bs(p.price)} c/u) = ${bs(p.price * qty)}`);
    const ship = t.shipping.free ? 'Gratis' : t.shipping.amount != null ? bs(t.shipping.amount) : 'Por confirmar';
    const text = [
      'Hola Peques Bo 👋 Quiero hacer este pedido:', '',
      `Pedido: ${S.order.number}`, `Nombre: ${f.name.trim()}`, `Número: ${f.phone.trim()}`, `Ciudad: ${f.city.trim()}`,
      `Material para: ${f.material || '—'}`, '',
      'Productos:', ...items, '',
      `Subtotal: ${bs(t.subtotal)}`,
      ...(t.discount ? [`Cupón ${S.coupon.code}: − ${bs(t.discount)}`] : []),
      `Envío: ${ship}`,
      `Total: ${bs(t.total)}${t.shipping.amount == null ? ' + envío' : ''}`
    ].join('\n');
    return { t, text };
  }

  async function saveOrder(t) {
    if (!PB.sb || S.order.saved) return;
    S.order.saved = true;
    const f = S.form;
    try {
      await PB.sb.from('orders').insert({
        order_number: S.order.number, customer_name: f.name.trim(), phone: f.phone.trim(), city: f.city.trim(),
        material_for: f.material || null,
        items: t.ls.map(({ p, qty }) => ({ id: p.id, name: p.name, qty, price: p.price })),
        subtotal: t.subtotal, discount: t.discount, coupon: S.coupon ? S.coupon.code : null,
        shipping: t.shipping.amount, total: t.total, status: 'nuevo'

  /* ---------- PDFs y compartir ---------- */
  /* ---------- pago de PDFs ---------- */
  const RATES_KEY = 'pequesbo_rates_v1';
  function cachedRates() { try { const r = JSON.parse(localStorage.getItem(RATES_KEY)); if (r && r.ars > 0 && r.pen > 0) return r; } catch (e) { /* sin caché */ } return null; }
  async function fetchRates() {
    if (S.settings.pay_auto_rate === false) return null;
    const c = cachedRates(); if (c && Date.now() - c.t < 12 * 3600e3) return c;
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 4500);
      const res = await fetch('https://open.er-api.com/v6/latest/USD', { signal: ctl.signal }); clearTimeout(to);
      const j = await res.json();
      if (j && j.result === 'success' && j.rates && j.rates.ARS > 0 && j.rates.PEN > 0) {
        const r = { t: Date.now(), ars: j.rates.ARS, pen: j.rates.PEN };
        try { localStorage.setItem(RATES_KEY, JSON.stringify(r)); } catch (e) { /* ok */ } return r;
      }
    } catch (e) { /* si falla, se usa el respaldo */ }
    return c;
  }
  function rateFor(cur) {
    const st = S.settings; const key = cur === 'ARS' ? 'ars' : 'pen';
    const auto = st.pay_auto_rate !== false ? (S.rates || cachedRates()) : null;
    if (auto && auto[key] > 0) return { rate: auto[key], auto: true };
    const man = Number(cur === 'ARS' ? st.pay_rate_ars : st.pay_rate_pen) || 0;
    return man > 0 ? { rate: man, auto: false } : null;
  }
  const payUser = (u) => String(u || '').trim().replace(/^https?:\/\/(www\.)?paypal\.me\//i, '').replace(/^@/, '').replace(/\/.*$/, '');
  function payOptions(p) {
    const st = S.settings; const pm = st.pay_methods || {}; const on = (k) => pm[k] !== false; const o = [];
    const usd = 'USD ' + num(p.price); const mg = 1 + (Number(st.pay_margin) || 0) / 100;
    if (on('hotmart') && p.pay_url) o.push({ k: 'hotmart', label: 'Tarjeta y otros medios', brand: 'Hotmart', note: 'Todos los países · entrega automática', price: usd });
    if (on('paypal') && payUser(st.paypal_user)) o.push({ k: 'paypal', label: 'PayPal', note: 'Todo el mundo', price: usd });
    const ra = rateFor('ARS');
    if (on('mercadopago') && st.mp_alias && ra) { const v = Math.ceil((p.price * ra.rate * mg) / 100) * 100; o.push({ k: 'mp', label: 'MercadoPago', note: 'Solo Argentina', price: 'ARS ' + v.toLocaleString('es-AR'), auto: ra.auto }); }
    const rp = rateFor('PEN');
    if (on('yape') && st.yape_number && rp) { const v = Math.ceil(p.price * rp.rate * mg * 2) / 2; o.push({ k: 'yape', label: 'Yape', note: 'Solo Perú', price: 'S/ ' + (Number.isInteger(v) ? v : v.toFixed(2)), auto: rp.auto }); }
    return o;
  }
  const payWa = (p, o) => waLink(`Hola Peques Bo 👋 Ya pagué el PDF "${p.name}" por ${o.label} (${o.price}). Te envío mi comprobante.`);
  function payDetail(p, o) {
    const st = S.settings; const wa = `<a class="btn btn-block" href="${payWa(p, o)}" target="_blank" rel="noopener" data-act="pay-wa">Ya pagué: enviar comprobante por WhatsApp</a>`;
    const copy = (v, l) => `<div class="paynum"><b>${esc(v)}</b><button class="btn btn-sm" data-act="pay-copy" data-v="${esc(v)}">${l}</button></div>`;
    if (o.k === 'hotmart') return `<button class="btn btn-primary btn-block" data-act="pay-go">Pagar con Hotmart</button><p class="fine">Se abre la página segura de Hotmart. Al pagar, recibes tu PDF automáticamente.</p>`;
    if (o.k === 'paypal') return `<button class="btn btn-primary btn-block" data-act="pay-go">Pagar con PayPal</button><p class="fine">Cuando pagues, envíanos el comprobante por WhatsApp y te mandamos el PDF.</p>${wa}`;
    if (o.k === 'mp') return `<p>Transfiere <b>${esc(o.price)}</b> al siguiente alias o CVU de MercadoPago:</p>${copy(st.mp_alias, 'Copiar')}${st.mp_holder ? `<p class="fine">Titular: ${esc(st.mp_holder)}</p>` : ''}<p class="fine">Después envíanos el comprobante por WhatsApp y te mandamos el PDF.</p>${wa}`;
    return `<p>Yapea <b>${esc(o.price)}</b> a este número:</p>${copy(st.yape_number, 'Copiar')}${st.yape_holder ? `<p class="fine">Titular: ${esc(st.yape_holder)}</p>` : ''}${st.yape_qr ? `<img class="payqr" src="${esc(st.yape_qr)}" alt="QR de Yape">` : ''}<p class="fine">Después envíanos el comprobante por WhatsApp y te mandamos el PDF.</p>${wa}`;
  }
  function renderPay() {
    if (!S.pay) return; const { p } = S.pay; const box = $('#paymodal .paybox'); if (!box) return;
    const opts = payOptions(p); const o = opts.find((x) => x.k === S.pay.m) || opts[0]; if (o) S.pay.m = o.k;
    const waAsk = `<a class="btn btn-primary btn-block" href="${waLink(`Hola Peques Bo 👋 Quiero el PDF: ${p.name} (${priceOf(p, p.price)})`)}" target="_blank" rel="noopener">Pedir por WhatsApp</a>`;
    box.innerHTML = `<button class="p-btn x" data-act="pay-close" aria-label="Cerrar">×</button><h2>${esc(p.name)}</h2>`
      + (o ? `<p class="pay-price" aria-live="polite">${esc(o.price)}</p>
        <p class="fine" style="text-align:left;margin:0 0 8px">Elige cómo pagar:</p>
        <div class="paychoices" role="radiogroup" aria-label="Medio de pago">${opts.map((x) => `<button class="paychoice" role="radio" aria-checked="${x.k === o.k}" data-act="pay-pick" data-m="${x.k}"><b>${esc(x.label)}${x.brand ? ' · ' + esc(x.brand) : ''}</b><span>${esc(x.price)}</span><small>${esc(x.note)}</small></button>`).join('')}</div>
        <div class="paydetail">${payDetail(p, o)}</div>
        ${o.auto ? '<p class="fine">Monto calculado al tipo de cambio de hoy. Tipos de cambio: <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates By Exchange Rate API</a>.</p>' : ''}`
        : S.pay.loading ? '<p class="empty" style="padding:24px 0">Calculando precios…</p>' : `<p>Escríbenos por WhatsApp y te indicamos cómo pagar.</p>${waAsk}`);
  }
  function closePay() { const m = $('#paymodal'); if (m) { m.hidden = true; m.querySelector('.paybox').innerHTML = ''; } S.pay = null; if ($('#modal').hidden && $('#drawer').hidden && $('#menu').hidden) document.body.classList.remove('lock'); }
  function openPay(p) {
    S.pay = { p, m: null, loading: true };
    let m = $('#paymodal');
    if (!m) { m = document.createElement('div'); m.id = 'paymodal'; m.innerHTML = '<div class="paybox" role="dialog" aria-modal="true" aria-label="Pagar PDF"></div>'; document.body.appendChild(m); m.addEventListener('click', (e) => { if (e.target === m) closePay(); }); }
    m.hidden = false; document.body.classList.add('lock'); renderPay();
    fetchRates().then((r) => { if (r) S.rates = r; if (S.pay && S.pay.p === p) { S.pay.loading = false; renderPay(); } });
  }
  function payGo() {
    if (!S.pay) return; const { p, m } = S.pay;
    if (m === 'hotmart') window.open(p.pay_url, '_blank', 'noopener');
    if (m === 'paypal') window.open(`https://www.paypal.me/${encodeURIComponent(payUser(S.settings.paypal_user))}/${Number(p.price)}USD`, '_blank', 'noopener');
  }
  function requestPdf(id) {
    const p = find(id); if (!p) return;
    track('Contact', p);
    if (p.is_free) {
      if (p.pay_url) { window.open(p.pay_url, '_blank', 'noopener'); return; }
      const w = window.open(waLink(`Hola Peques Bo 👋 Quiero el PDF gratis: ${p.name}`), '_blank'); if (!w) toast('Escríbenos por WhatsApp para recibir tu PDF.'); return;
    }
    openPay(p);
  }
  async function share(id) {
    const p = find(id); if (!p) return;
    const url = baseUrl() + '#/p/' + p.id;
    if (navigator.share) { try { await navigator.share({ title: p.name, text: p.name + ' · Peques Bo', url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    toast((await copyText(url)) ? 'Enlace copiado' : url);
  }

  /* ---------- buscador ---------- */
  function search(q) {
    const n = norm(q); const out = $('#searchres');
    if (n.length < 2) { out.innerHTML = ''; return; }
    const res = vis().filter((p) => norm([p.name, p.description, p.topics.map((t) => (PB.TOPICS[t] || {}).label).join(' '), p.ages.map((a) => PB.AGES[a]).join(' ')].join(' ')).includes(n)).slice(0, 8);
    out.innerHTML = res.length ? res.map((p) => `<button class="sr" data-act="detail" data-id="${esc(p.id)}"><img src="${esc(p.images[0] || '')}" alt=""><span><b>${esc(p.name)}</b><span>${p.is_free ? 'Gratis' : priceOf(p, p.price)}</span></span></button>`).join('')
      : '<p class="empty" style="padding:12px 0">No encontramos ese libro. Prueba con otra palabra.</p>';
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act; const id = t.dataset.id;
    switch (a) {
      case 'detail': $('#searchbar').hidden = true; openDetail(id); break;
      case 'add': addToCart(id); break;
      case 'request': requestPdf(id); break;
      case 'pay-close': closePay(); break;
      case 'pay-pick': if (S.pay) { S.pay.m = t.dataset.m; renderPay(); } break;
      case 'pay-go': payGo(); break;
      case 'pay-copy': copyText(t.dataset.v).then((ok) => toast(ok ? 'Copiado' : 'No se pudo copiar')); break;
      case 'pay-wa': track('Contact'); break;
      case 'share': share(id); break;
      case 'close-modal': closeModal(); break;
      case 'close-all': closeAll(); break;
      case 'open-cart': openPanel('cart'); break;
      case 'menu-toggle': openPanel('menu'); break;
      case 'search-toggle': { const b = $('#searchbar'); b.hidden = !b.hidden; if (!b.hidden) $('#q').focus(); break; }
      case 'f-age': S.f.age = t.dataset.v; $('#view').innerHTML = viewCatalog(); break;
      case 'f-topic': S.f.topic = t.dataset.v; $('#view').innerHTML = viewCatalog(); break;
      case 'inc': { const c = S.cart.find((x) => String(x.id) === id); if (c) c.qty++; saveCart(); renderPanel(); break; }
      case 'dec': { const c = S.cart.find((x) => String(x.id) === id); if (c) { c.qty--; if (c.qty <= 0) S.cart = S.cart.filter((x) => x !== c); } saveCart(); renderPanel(); break; }
      case 'rm': S.cart = S.cart.filter((x) => String(x.id) !== id); saveCart(); renderPanel(); break;
      case 'clear': if (confirm('¿Vaciar todo tu pedido?')) { S.cart = []; S.coupon = null; saveCart(); renderPanel(); } break;
      case 'coupon': if (FEATURES.cupones) applyCoupon($('#coupon').value); break;
      case 'next': S.panel = 'form'; renderPanel(); track('InitiateCheckout'); break;
      case 'back': S.panel = 'cart'; renderPanel(); break;
      case 'wa': sendWhatsApp(); break;
      case 'copy': copyOrder(); break;
      case 'contact': track('Contact'); break;
      case 'gal': S.gi = Number(t.dataset.i); $('.gal').innerHTML = galHtml(S.cur); break;
      case 'gal-prev': case 'gal-next': {
        const n = mediaOf(S.cur).length; S.gi = (S.gi + (a === 'gal-next' ? 1 : -1) + n) % n; $('.gal').innerHTML = galHtml(S.cur); break;
      }
      default: break;
    }
  });
  document.addEventListener('change', (e) => {
    const a = e.target.dataset.act;
    if (a === 'sort') { S.f.sort = e.target.value; $('#view').innerHTML = viewCatalog(); }
    if (a === 'topic') { S.f.topic = e.target.value; $('#view').innerHTML = viewCatalog(); }
  });
  $('#q').addEventListener('input', (e) => search(e.target.value));
  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('#paymodal') && !$('#paymodal').hidden) closePay(); else if (!$('#modal').hidden) closeModal(); else closeAll();
  });
  window.addEventListener('hashchange', route);

  /* ---------- arranque ---------- */
  async function init() {
    loadCart();
    try {
      const d = await PB.load();
      S.products = d.products; S.settings = d.settings; S.reviews = d.reviews; S.demo = d.demo;
    } catch (err) {
      $('#view').innerHTML = '<div class="wrap empty"><p>No pudimos cargar el catálogo. Revisa tu conexión e inténtalo de nuevo.</p><button class="btn btn-primary" onclick="location.reload()">Reintentar</button></div>';
      return;
    }
    initPixels();
    if (S.demo) { const b = $('#demobar'); b.hidden = false; b.textContent = 'Vista previa con productos de ejemplo.'; }
    $('#cartcount').textContent = count();
    renderFooter(); route();
  }
  init();
})();

</script>
</body>
</html>
